<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <link rel="stylesheet" href="static/style3d.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
        <title>Portfólio João Pedro</title>
        <script src="https://kit.fontawesome.com/0db4c44db2.js" crossorigin="anonymous"></script>
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Portfólio João Pedro" />
    </head>
    <body>

        <div class="cursor"></div> 
        
        <div id="preloader">
            <img class="VideoLoader" src="images/bbb.webp" alt="" loading="eager">
        </div>
        
        <header> 
            <a href="index.html"><h1>JOÃO PEDRO</h1> </a> 
        </header>
    
        <br/>

        <main>

            <div>
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/doctorfit.mp4"></video>
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/4k_7_4.webp" alt="Renderização 3D em 4K de projeto de motion design">
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/sala2.webp" alt="Renderização 3D de ambiente interno">
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/running-1.mp4"></video>
            </div>

            <div>
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/capoeira insta.webp" alt="Still de vídeo de capoeira para Instagram">
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/capoeira reels.mp4"></video>
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/lycra soulfins.mp4"></video>
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/4k_7_1.webp" alt="Renderização 3D em 4K de projeto de motion design">
            </div>

            <div>
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/kimarco-1.webp" alt="Renderização 3D do projeto Kimarco">
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/flower3d.mp4"></video>
                <video data-tilt data-tilt-max="4" class="foto-web4" preload="auto" muted loop autoplay src="images/figure3d.mp4"></video>
                <img data-tilt data-tilt-max="4" loading="lazy" decoding="async" class="foto-web4" src="images/brumed.webp" alt="Renderização 3D do projeto Brumed">
            </div>

            <div class="responsive-iframe">
                <video class="foto-web5" preload="auto" muted loop autoplay src="images/4beach.mp4"></video>
            </div>

            <footer>
                <div class="footer-container">
    
                    <div class="footer-content">
                    </div>
    
                </div>
            </footer>

        </main>
    </body>

    <script type="text/javascript" src="vanilla-tilt.js"></script>
    <script>
        var loaderer = document.getElementById("preloader");

        window.addEventListener("load", function(){
            loaderer.style.display = "none";
        })
    </script>

    <script src="preloadimagens.js"></script>
    <script src="preloadvideos.js"></script>
    
    <script>
        const cursor = document.querySelector('.cursor');

        document.addEventListener('mousemove', (e) => {
            const x = e.pageX;
            const y = e.pageY;
            
            cursor.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>

</html>
