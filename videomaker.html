<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <link rel="stylesheet" href="static/stylevideomaker.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
        <title>Portfólio João Pedro</title>
        <script src="https://kit.fontawesome.com/0db4c44db2.js" crossorigin="anonymous"></script>
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Portfólio João Pedro" />
    </head>

    <body>

        <div class="cursor"></div>

        <div id="preloader">
            <img class="VideoLoader" src="images/bbb.webp" alt="" loading="eager">
        </div>
        
        <header> 
            <a href="index.html"><h1>JOÃO PEDRO</h1> </a> 
        </header>

        <br/>

        <main>
            <div class="web">
                <video class="VideoVertical" preload="auto" muted loop autoplay controls src="images/apresentacao-leonardo.mp4"></video>
                <video class="VideoVertical" preload="auto" muted loop autoplay controls src="images/apresentacao-ronaldo.mp4"></video>
                <video preload="auto" muted loop autoplay controls src="images/vila.mp4"></video>
                <video preload="auto" muted loop autoplay controls src="images/ecatarina.mp4"></video>
                <video preload="auto" muted loop autoplay controls src="images/texol.mp4"></video>
                <video preload="auto" muted loop autoplay controls src="images/expo.mp4"></video>
            </div>
    
            <footer>
                <div class="footer-container">
    
                    <div class="footer-content">
                    </div>
    
                </div>
            </footer>

        </main>
    </body>

    <script>
        var loaderer = document.getElementById("preloader");

        window.addEventListener("load", function(){
            loaderer.style.display = "none";
        })
    </script>

    <script src="preloadvideos.js"></script>
    
    <script>
        const cursor = document.querySelector('.cursor');

        document.addEventListener('mousemove', (e) => {
            const x = e.pageX;
            const y = e.pageY;
            
            cursor.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
    
</html>
